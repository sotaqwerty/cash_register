<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<title>レジ過不足調整</title>
<style>
/* ===========================================================
   1. カラートークン（ダーク基準 / ライトは @media で上書き）
   =========================================================== */
:root{
  color-scheme: dark;
  --bg:#000;
  --grad1:rgba(41,151,255,.20);
  --grad2:rgba(191,90,242,.10);

  --chrome:rgba(22,22,23,.70);
  --chrome-edge:rgba(0,0,0,.55);

  --eyebrow-a:#2997ff; --eyebrow-b:#bf5af2;

  /* material weight: 構造=重い / 操作要素=軽い */
  --mat-structural:rgba(255,255,255,.055);
  --mat-control:rgba(255,255,255,.09);
  --mat-control-hi:rgba(255,255,255,.14);
  --mat-control-press:rgba(255,255,255,.22);
  --edge-top:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  --shadow-sm:0 6px 18px rgba(0,0,0,.35);

  --well:rgba(0,0,0,.45);
  --well-active:rgba(0,0,0,.45);
  --ring:rgba(41,151,255,.14);
  --ph:#48484a;

  --accent:#2997ff; --accent2:#0071e3; --accent-hi:#0077ed; --accent-top:#3aa0ff;
  --accent-soft:rgba(41,151,255,.14);
  --accent-soft-line:rgba(41,151,255,.32);
  --accent-glow:rgba(0,113,227,.45);
  --sec-line:rgba(255,255,255,.22);
  --sec-hover:rgba(255,255,255,.06);

  --err:#ff8a80;
  --err-soft:rgba(255,69,58,.12);
  --err-soft-line:rgba(255,69,58,.28);
  --msg-err-bg:rgba(255,69,58,.10);
  --msg-err-line:rgba(255,69,58,.32);
  --msg-err-fg:#ff9a92;
  --msg-warn-bg:rgba(255,214,10,.10);
  --msg-warn-line:rgba(255,214,10,.32);
  --msg-warn-fg:#ffe066;

  --ok:#30d158;
  --ok-bg:linear-gradient(180deg,rgba(48,209,88,.11),rgba(255,255,255,.04));
  --ok-line:rgba(48,209,88,.32);

  --text:#f5f5f7;   /* vibrancy: primary */
  --text2:#d2d2d7;  /* vibrancy: secondary */
  --muted:#8e8e93;  /* vibrancy: tertiary（半透明面でも読める濃度） */
  --footer:#6e6e73;
  --row-line:rgba(255,255,255,.09);

  --radius:22px;
  --blur-chrome:blur(20px) saturate(180%);
  --blur-card:blur(26px) saturate(165%);
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --bg:#fbfbfd;
    --grad1:rgba(0,113,227,.10);
    --grad2:rgba(175,82,222,.07);

    --chrome:rgba(251,251,253,.72);
    --chrome-edge:rgba(251,251,253,.85);

    --eyebrow-a:#0071e3; --eyebrow-b:#af52de;

    --mat-structural:rgba(255,255,255,.72);
    --mat-control:rgba(255,255,255,.88);
    --mat-control-hi:#f0f0f2;
    --mat-control-press:#dcdce0;
    --edge-top:rgba(255,255,255,.9);
    --line:rgba(0,0,0,.09);
    --line2:rgba(0,0,0,.14);
    --shadow-lg:0 4px 14px rgba(0,0,0,.05), 0 18px 40px rgba(0,0,0,.07);
    --shadow-sm:0 4px 12px rgba(0,0,0,.08);

    --well:#f1f1f4;
    --well-active:#fff;
    --ring:rgba(0,113,227,.12);
    --ph:#c7c7cc;

    --accent:#0071e3; --accent2:#0071e3; --accent-hi:#0077ed; --accent-top:#2b8fff;
    --accent-soft:rgba(0,113,227,.08);
    --accent-soft-line:rgba(0,113,227,.26);
    --accent-glow:rgba(0,113,227,.35);
    --sec-line:rgba(0,0,0,.18);
    --sec-hover:rgba(0,0,0,.04);

    --err:#d70015;
    --err-soft:rgba(215,0,21,.07);
    --err-soft-line:rgba(215,0,21,.20);
    --msg-err-bg:rgba(215,0,21,.06);
    --msg-err-line:rgba(215,0,21,.26);
    --msg-err-fg:#b3000f;
    --msg-warn-bg:rgba(168,100,0,.08);
    --msg-warn-line:rgba(168,100,0,.28);
    --msg-warn-fg:#8a5200;

    --ok:#1d8a3a;
    --ok-bg:linear-gradient(180deg,rgba(29,138,58,.07),rgba(255,255,255,.75));
    --ok-line:rgba(29,138,58,.28);

    --text:#1d1d1f; --text2:#3a3a3c; --muted:#6e6e73; --footer:#86868b;
    --row-line:rgba(0,0,0,.08);
  }
}

/* ===========================================================
   2. ベース / タイポグラフィ（トラッキングとリーディングはサイズ固有）
   =========================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;}
html{touch-action:manipulation;}
body{
  font:100%/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-optical-sizing:auto;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; justify-content:center;
  padding:0 0 2.5rem;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(760px 420px at 50% -8%, var(--grad1), transparent 62%),
    radial-gradient(620px 380px at 92% 12%, var(--grad2), transparent 65%);
}
.app{width:100%; max-width:33rem; position:relative; z-index:1; padding:0 1.125rem;}

/* --- floating chrome：コンテンツはこの下を流れる --- */
.nav{
  position:sticky; top:0; z-index:30; margin:0 -1.125rem;
  height:2.875rem; display:flex; align-items:center; justify-content:center;
  background:var(--chrome);
  backdrop-filter:var(--blur-chrome); -webkit-backdrop-filter:var(--blur-chrome);
  font-size:.8125rem; line-height:1; letter-spacing:.01em; font-weight:500; color:var(--text);
}
/* scroll edge effect：1pxの罫線ではなく，重なる所だけをぼかす */
.nav::after{
  content:""; position:absolute; left:0; right:0; top:100%; height:1.25rem;
  background:linear-gradient(to bottom, var(--chrome-edge), transparent);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  mask-image:linear-gradient(to bottom, #000, transparent);
  -webkit-mask-image:linear-gradient(to bottom, #000, transparent);
  opacity:0; pointer-events:none;
}
.nav .dot{width:.375rem;height:.375rem;border-radius:50%;background:var(--accent);margin-right:.5rem;}

/* --- hero --- */
.hero{text-align:center; padding:3.25rem 0 2rem;}
.eyebrow{
  font-size:.9375rem; font-weight:600; line-height:1.3; letter-spacing:.012em;
  background:linear-gradient(90deg,var(--eyebrow-a),var(--eyebrow-b));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:.5rem;
}
h1{
  font-size:clamp(2.125rem,9vw,2.875rem);
  line-height:1.05;            /* 大きい文字は詰める */
  letter-spacing:-.024em;      /* 大きいほど負のトラッキング */
  font-weight:700; margin:0 0 .75rem;
}
.sub{
  font-size:1.0625rem; line-height:1.45; letter-spacing:.004em;
  color:var(--muted); margin:0;
}

/* ===========================================================
   3. カードとステップ（deck は高さが連続的に伸縮する）
   =========================================================== */
.deck{
  position:relative;
  overflow-x:clip; overflow-clip-margin:28px;
  will-change:height;
}
.card{
  background:var(--mat-structural);
  border:1px solid var(--line);
  border-top-color:var(--edge-top);
  border-radius:var(--radius);
  padding:1.625rem 1.375rem 1.375rem;
  backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card);
  box-shadow:var(--shadow-lg);
}
.deck > .card{
  position:absolute; top:0; left:0; width:100%;
  will-change:transform,opacity;
  touch-action:pan-y;              /* 横は自前で扱う */
}
.label{
  font-size:.875rem; line-height:1.45; letter-spacing:.008em;
  color:var(--muted); margin-bottom:.5rem;
}
.step-title{
  font-size:1.375rem; font-weight:700; line-height:1.2; letter-spacing:-.014em;
  margin-bottom:.625rem; display:flex; align-items:center; gap:.625rem;
}
.step-title .n{
  background:linear-gradient(180deg,var(--accent-top),var(--accent2)); color:#fff;
  width:1.625rem; height:1.625rem; border-radius:50%; flex:none;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:.875rem; font-weight:700; letter-spacing:0;
  box-shadow:0 .25rem .75rem var(--accent-glow);
}

/* --- display（へこんだ面：操作対象ではなく表示） --- */
.display{
  background:var(--well);
  border:1px solid var(--line2); border-radius:1rem;
  padding:1.125rem 1.25rem; min-height:2.75rem; text-align:right;
  font-size:clamp(2rem,8.5vw,2.5rem); font-weight:600; line-height:1.1;
  letter-spacing:-.022em;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  will-change:transform;
}
.display.active{
  background:var(--well-active);
  border-color:var(--accent-soft-line);
  box-shadow:0 0 0 .25rem var(--ring);
}
.display .unit{font-size:1.125rem; font-weight:400; letter-spacing:0; color:var(--muted); margin-left:.375rem;}
.display .ph{color:var(--ph); font-weight:300; font-size:2.125rem;}

/* --- keypad（軽いマテリアル＝触れる要素） --- */
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:.625rem; margin-top:.875rem;}
.key{
  background:var(--mat-control); border:1px solid var(--line);
  border-top-color:var(--edge-top);
  color:var(--text); border-radius:1rem; padding:1.0625rem 0;
  font:inherit; font-size:1.625rem; font-weight:400; line-height:1;
  font-variant-numeric:tabular-nums;
  cursor:pointer; user-select:none; -webkit-user-select:none;
  will-change:transform;
  /* 押下フィードバックは pointerdown でバネ駆動（CSSトランジションは使わない） */
}
.key:hover{background:var(--mat-control-hi);}
.key.pressed{background:var(--mat-control-press);}
.key.util{background:var(--err-soft); border-color:var(--err-soft-line); color:var(--err); font-size:1.25rem;}
.key.sign{background:var(--accent-soft); border-color:var(--accent-soft-line); color:var(--accent); font-size:1.5rem;}

/* --- buttons --- */
.btn{
  display:block; width:100%; border:none; border-radius:980px;
  padding:.9375rem 1.375rem; margin-top:.875rem;
  font:inherit; font-size:1.0625rem; font-weight:500; line-height:1.25; letter-spacing:.004em;
  color:#fff; background:var(--accent2);
  cursor:pointer; will-change:transform;
}
.btn:hover{background:var(--accent-hi);}
.btn.secondary{background:transparent; color:var(--accent); border:1px solid var(--sec-line);}
.btn.secondary:hover{background:var(--sec-hover);}
.btn:disabled{opacity:.3; cursor:default; background:var(--accent2);}
.btn:disabled:hover{background:var(--accent2);}
.swipe-hint{
  text-align:center; font-size:.75rem; letter-spacing:.01em;
  color:var(--footer); margin-top:.625rem;
}

/* --- messages / conditions --- */
.msg{
  border-radius:1rem; padding:.875rem 1rem; margin-top:.875rem;
  font-size:.9375rem; line-height:1.55; letter-spacing:.004em;
  will-change:transform,opacity;
}
.msg.err{background:var(--msg-err-bg); border:1px solid var(--msg-err-line); color:var(--msg-err-fg);}
.msg.warn{background:var(--msg-warn-bg); border:1px solid var(--msg-warn-line); color:var(--msg-warn-fg);}
.cond{
  background:var(--mat-control); border:1px solid var(--line);
  border-radius:.875rem; padding:.75rem .875rem; margin-top:.5rem;
  font-size:.9375rem; line-height:1.55; color:var(--text2);
}
.cond b{color:var(--accent); font-weight:600;}
.modlist{display:flex; gap:.625rem; flex-wrap:wrap; margin:.625rem 0 1rem;}
.modchip{
  background:linear-gradient(180deg,var(--accent-top),var(--accent2)); color:#fff;
  border-radius:980px; padding:.4375rem 1.25rem;
  font-size:1.1875rem; font-weight:600; line-height:1.2; letter-spacing:0;
  font-variant-numeric:tabular-nums;
  box-shadow:0 .375rem 1.125rem var(--accent-glow);
  will-change:transform,opacity;
}

/* --- result --- */
.result{
  background:var(--ok-bg); border:1px solid var(--ok-line);
  border-radius:var(--radius); padding:1.5rem 1.375rem; margin-top:1rem;
  box-shadow:var(--shadow-lg);
  backdrop-filter:var(--blur-card); -webkit-backdrop-filter:var(--blur-card);
  will-change:transform,opacity,filter;
}
.result h2{
  margin:0 0 .875rem; font-size:1.3125rem; font-weight:700; line-height:1.25;
  letter-spacing:-.014em; color:var(--ok);
}
.row{
  display:flex; justify-content:space-between; align-items:center; gap:.75rem;
  padding:.6875rem 0; border-bottom:1px solid var(--row-line);
  font-size:1rem; line-height:1.45;
}
.row:last-child{border-bottom:none;}
.row .c{color:var(--accent); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums;}
.total{margin-top:.875rem; text-align:right; font-size:.9375rem; font-weight:600; color:var(--text2);}
.big{
  font-size:1.875rem; font-weight:700; line-height:1.15; letter-spacing:-.022em;
  color:var(--accent); font-variant-numeric:tabular-nums;
}

.hidden{display:none;}
.footer{
  text-align:center; color:var(--footer);
  font-size:.75rem; line-height:1.5; letter-spacing:.012em;
  margin:1.625rem 0 .625rem;
}

/* ===========================================================
   4. アクセシビリティ：3つの独立したシグナルに応答
   =========================================================== */
@media (prefers-reduced-motion: reduce){
  .card,.result,.msg,.modchip,.key,.btn,.display{transition:opacity .2s ease !important;}
  /* バネ駆動はJS側でも即時スナップに切り替わる */
}
@media (prefers-reduced-transparency: reduce){
  .nav,.card,.result{backdrop-filter:none; -webkit-backdrop-filter:none;}
  .nav{background:var(--bg);}
  .card,.result{background:var(--bg);}
  .nav::after{backdrop-filter:none; -webkit-backdrop-filter:none;}
}
@media (prefers-contrast: more){
  :root{--line:currentColor; --line2:currentColor; --muted:var(--text);}
  .nav,.card,.result{background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none;}
  .key,.cond,.display{border-width:2px;}
  .btn.secondary{border-width:2px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="nav" id="nav"><span class="dot"></span>レジ過不足調整</div>

  <div class="hero">
    <div class="eyebrow">Cash Register Utility</div>
    <h1>レジ過不足<br>調整計算</h1>
    <p class="sub">ズレを入力するだけ。最適な構成を、すぐに。</p>
  </div>

  <div class="deck" id="deck">
    <!-- STEP 1 -->
    <div class="card" id="card1">
      <div class="step-title"><span class="n">1</span>ズレの額を入力</div>
      <div class="label">不足のときは「−」で符号を反転</div>
      <div class="display active" id="dispA" data-field="a"><span class="ph">0</span></div>
      <div class="keypad" id="padA"></div>
      <button class="btn" id="btnNext">次へ</button>
    </div>

    <!-- STEP 2 -->
    <div class="card" id="card2">
      <div class="step-title"><span class="n">2</span>戻す額を入力</div>
      <div id="condBox"></div>
      <div class="label" style="margin-top:.875rem;">戻す額（<span id="minB"></span> 円以上）</div>
      <div class="display active" id="dispB" data-field="b"><span class="ph">0</span></div>
      <div class="keypad" id="padB"></div>
      <button class="btn" id="btnCalc">計算する</button>
      <button class="btn secondary" id="btnBack">ズレの額を修正</button>
      <div class="swipe-hint">右へスワイプしても戻れます</div>
      <div id="msgB"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultBox"></div>

  <button class="btn secondary" id="btnReset" style="display:none">最初からやり直す</button>

  <div class="footer">オフライン動作 / インストール不要</div>
</div>

<script>
"use strict";

/* ===== ピンチによるズーム抑止（ダブルタップ拡大はCSSのtouch-action:manipulationで無効化） ===== */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });

/* ===== データ定義（Python版と同一） ===== */
// --------------------2026/10月版--------------------------------
const menuPrices = {
  'パイ(250円)':250,
  'クッキー(270円)':270,
  'モンブラン(300円)':300,
  'モンブランクッキー(320円)':320,
  '焼きチーズ(340円)':340,
  'GODIVA(520円)':520
};
// ------------------------2026/10月版----------------------------
// 戻し(b)に使える袋
const returnBags = {
  0:{count:0,items:{}},
  3:{count:1,items:{'小(3円)':1}},
  5:{count:1,items:{'大(5円)':1}},
  6:{count:2,items:{'小(3円)':2}},
  8:{count:2,items:{'小(3円)':1,'大(5円)':1}}
};
// 空打ち(c)に使える袋
const addBags = {
  0:{count:0,items:{}},
  3:{count:1,items:{'小(3円)':1}},
  5:{count:1,items:{'大(5円)':1}},
  6:{count:2,items:{'小(3円)':2}},
  8:{count:2,items:{'小(3円)':1,'大(5円)':1}},
  11:{count:3,items:{'小(3円)':2,'大(5円)':1}}
};
// Python互換のmod（負数対応）
const mod = (n,m)=>((n%m)+m)%m;
// 整数キーを挿入順（=昇順）で取り出す
const keysNum = o => Object.keys(o).map(Number);

/* ===== ステップ1のロジック：最適な戻し下一桁を探索 ===== */
function computeOptimal(a){
  const aMod = mod(a,10);
  let bestCost = Infinity;
  let optimalBMods = [];
  const bestBagCombos = {}; // b_mod -> [b_val, c_val]

  for(const bVal of keysNum(returnBags)){
    const bInfo = returnBags[bVal];
    const cMod = mod(aMod + bVal, 10);
    for(const cVal of keysNum(addBags)){
      const cInfo = addBags[cVal];
      if(mod(cVal,10) === cMod){
        const cost = bInfo.count + cInfo.count;
        if(cost < bestCost){
          bestCost = cost;
          optimalBMods = [mod(bVal,10)];
          bestBagCombos[mod(bVal,10)] = [bVal, cVal];
        } else if(cost === bestCost){
          const bm = mod(bVal,10);
          if(!optimalBMods.includes(bm)){
            optimalBMods.push(bm);
            bestBagCombos[bm] = [bVal, cVal];
          }
        }
      }
    }
  }
  optimalBMods.sort((x,y)=>x-y);
  return {optimalBMods, bestBagCombos};
}

/* ===== ステップ2のロジック：構成探索（DP） ===== */
function computePlan(a, b, optimalBMods, bestBagCombos){
  if(b < -a){
    return {ok:false, type:'err',
      msg:`「空打ち額」が自然数になりません。${-a+1} 円以上を入力してください。`};
  }
  const bMod = mod(b,10);
  if(!optimalBMods.includes(bMod)){
    return {ok:false, type:'warn',
      msg:`「戻す額の下一桁」が最適リスト [${optimalBMods.join(', ')}] に含まれていません。再入力してください。`};
  }
  const c = a + b;
  const [bValTarget, cBagVal] = bestBagCombos[bMod];
  const cMenuTarget = c - cBagVal;

  if(cMenuTarget < 0){
    return {ok:false, type:'err',
      msg:`金額が小さすぎます（袋の金額 ${cBagVal} 円を引くとマイナス）。より大きな「戻す額」を入力してください。`, c};
  }

  // DP：10円刻みで最小点数の構成
  const dp = {0:{}};
  for(let i=10; i<=cMenuTarget; i+=10){
    let minItems = Infinity, bestCombo = null;
    for(const name in menuPrices){
      const price = menuPrices[name];
      if(i>=price && (i-price) in dp){
        const combo = Object.assign({}, dp[i-price]);
        combo[name] = (combo[name]||0)+1;
        const cnt = Object.values(combo).reduce((s,v)=>s+v,0);
        if(cnt < minItems){ minItems=cnt; bestCombo=combo; }
      }
    }
    if(bestCombo!==null) dp[i]=bestCombo;
  }

  if(cMenuTarget in dp){
    const finalCombo = Object.assign({}, dp[cMenuTarget]);
    for(const bagName in addBags[cBagVal].items){
      finalCombo[bagName] = addBags[cBagVal].items[bagName];
    }
    let total = 0;
    for(const k in finalCombo) total += finalCombo[k];
    return {ok:true, c, combo:finalCombo, total, cMenuTarget};
  }
  return {ok:false, type:'err', c,
    msg:`袋を引いた残り ${cMenuTarget} 円は現在のメニューでは構成できません。さらに大きな「戻す額」を入力してください。`};
}

/* ===== 袋アイテムを文字列化 ===== */
function bagStr(items){
  const keys = Object.keys(items);
  if(keys.length===0) return 'レジ袋なし';
  return keys.map(k=>`${k} ${items[k]}個`).join('，');
}

/* ===========================================================
   モーション基盤：バネ（damping ratio × response）
   - 常に「現在の表示値」から走る → 中断・反転が自然
   - re-target 時も速度を引き継ぐ（反転時の“壁”を作らない）
   =========================================================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

class Spring{
  /** @param {number} value 初期値 */
  constructor(value, opts){
    this.value = value; this.velocity = 0; this.target = value;
    this.precision = (opts && opts.precision) || 0.1;
    this.vPrecision = this.precision * 6;
    this.setParams(opts || {});
    this.listeners = []; this.raf = null; this.onRest = null;
  }
  /** bounce 0 = damping 1.0（オーバーシュートなし）, 0.2 ≒ damping 0.8 */
  setParams({bounce = 0, duration = 0.4} = {}){
    this.zeta = 1 - Math.min(0.9, Math.max(0, bounce));
    this.omega = (2 * Math.PI) / duration;
    return this;
  }
  onUpdate(fn){ this.listeners.push(fn); return this; }
  emit(){ for(const fn of this.listeners) fn(this.value, this); }
  /** 値を直接差し替え（ドラッグ中の1:1追従用。速度は履歴から別管理） */
  setValue(v){ this.stop(); this.value = v; this.emit(); return this; }
  /** 目標を差し替え。velocity を渡すと指紋の速度をそのまま引き継ぐ */
  to(target, {velocity, bounce, duration} = {}){
    if(bounce !== undefined || duration !== undefined){
      this.setParams({bounce: bounce ?? (1 - this.zeta), duration: duration ?? (2*Math.PI/this.omega)});
    }
    this.target = target;
    if(velocity !== undefined) this.velocity = velocity;
    this.start();
    return this;
  }
  start(){
    if(reduceMotion.matches){
      this.stop(); this.value = this.target; this.velocity = 0;
      this.emit(); if(this.onRest) this.onRest(); return;
    }
    if(this.raf !== null) return;
    let last = performance.now();
    const tick = (now) => {
      let dt = (now - last) / 1000; last = now;
      if(dt > 1/30) dt = 1/30;                 // タブ復帰時の暴走を防ぐ
      const steps = Math.max(1, Math.ceil(dt / (1/120)));
      const h = dt / steps;
      const k = this.omega * this.omega;
      const c = 2 * this.zeta * this.omega;
      for(let i = 0; i < steps; i++){
        const accel = -k * (this.value - this.target) - c * this.velocity;
        this.velocity += accel * h;
        this.value += this.velocity * h;
      }
      this.emit();
      if(Math.abs(this.value - this.target) < this.precision &&
         Math.abs(this.velocity) < this.vPrecision){
        this.value = this.target; this.velocity = 0; this.emit();
        this.raf = null; if(this.onRest) this.onRest(); return;
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  stop(){ if(this.raf !== null){ cancelAnimationFrame(this.raf); this.raf = null; } return this; }
}

/* 速度からの着地点予測（Apple の Designing Fluid Interfaces と同じ指数減衰形） */
function project(initialVelocity, decelerationRate = 0.998){
  return (initialVelocity / 1000) * decelerationRate / (1 - decelerationRate);
}
/* ラバーバンド：境界の外側は進むほど追従が鈍る */
function rubberband(overshoot, dimension, constant = 0.55){
  return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

/* 触覚：意味のある瞬間だけ（commit / error） */
function haptic(pattern){
  if(navigator.vibrate) { try{ navigator.vibrate(pattern); }catch(_){} }
}

/* ===========================================================
   押下フィードバック：pointerdown で即座に，離したらバネで戻る
   =========================================================== */
function makePressable(el, pressScale){
  const s = new Spring(1, {bounce:0, duration:0.12, precision:0.0015});
  s.onUpdate(v => { el.style.transform = `scale(${v})`; });
  let holding = false;
  const down = () => {
    if(el.disabled) return;
    holding = true;
    el.classList.add('pressed');
    // response 0.12s：知覚上は即時。それでも中断可能
    s.to(pressScale, {bounce:0, duration:0.12});
  };
  const up = () => {
    if(!holding) return;
    holding = false;
    el.classList.remove('pressed');
    // 離した瞬間は“勢い”があるので少しだけバウンス
    s.to(1, {bounce:0.28, duration:0.34});
  };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);   // 離れて戻れる＝キャンセル可能
  return s;
}

/* 出現アニメーション：ガラス面は「ぼけ＋拡大」で“実体化”させる */
function materialize(el, {blur = 8, lift = 12, scaleFrom = 0.965, bounce = 0, duration = 0.45} = {}){
  if(!el) return;
  const s = new Spring(0, {bounce, duration, precision:0.002});
  s.onUpdate(p => {
    const inv = 1 - p;
    el.style.opacity = String(clamp01(p));
    el.style.transform = `translate3d(0,${inv * lift}px,0) scale(${scaleFrom + (1 - scaleFrom) * p})`;
    el.style.filter = inv > 0.01 ? `blur(${inv * blur}px)` : '';
  });
  s.onRest = () => { el.style.filter = ''; el.style.transform = ''; el.style.opacity = ''; };
  s.emit();
  s.to(1);
  return s;
}

/* ===========================================================
   ステップ遷移：0 = STEP1，1 = STEP2 を1本のバネで駆動
   ボタンでもスワイプでも同じ値を動かすので，経路が常に対称
   =========================================================== */
const deck   = document.getElementById('deck');
const card1  = document.getElementById('card1');
const card2  = document.getElementById('card2');
const navEl  = document.getElementById('nav');
const btnReset = document.getElementById('btnReset');

let W = 1, h1 = 0, h2 = 0;
const navSpring = new Spring(0, {bounce:0, duration:0.4, precision:0.0015});

function measure(){
  W = Math.max(1, deck.clientWidth);
  h1 = card1.offsetHeight;
  h2 = card2.offsetHeight;
  applyNav(navSpring.value);
}

function applyNav(p){
  const x2 = (1 - p) * W;
  const x1 = -p * W * 0.30;           // 下の層は控えめに動く（視差）
  card2.style.transform = `translate3d(${x2}px,0,0)`;
  card2.style.opacity = String(clamp01(p * 1.25));
  card1.style.transform = `translate3d(${x1}px,0,0) scale(${1 - 0.035 * clamp01(p)})`;
  card1.style.opacity = String(clamp01(1 - p * 1.15));
  card1.style.visibility = p > 0.999 ? 'hidden' : 'visible';
  card2.style.visibility = p < 0.001 ? 'hidden' : 'visible';
  card1.style.pointerEvents = p < 0.5 ? 'auto' : 'none';
  card2.style.pointerEvents = p >= 0.5 ? 'auto' : 'none';
  deck.style.height = (h1 + (h2 - h1) * clamp01(p)) + 'px';
}
navSpring.onUpdate(applyNav);

/* --- STEP2 を右へスワイプして戻す（ボタンと同じ機能・1:1追従） --- */
(function enableSwipeBack(){
  let active = false, armed = false, startX = 0, startY = 0, startNav = 1;
  let history = [];   // 速度は直近数フレームの履歴から出す

  const interactive = t => t.closest('button, input, textarea, select, a');

  card2.addEventListener('pointerdown', e => {
    if(navSpring.value < 0.999) return;
    if(interactive(e.target)) return;
    armed = true; active = false;
    startX = e.clientX; startY = e.clientY; startNav = navSpring.value;
    history = [{x:e.clientX, t:performance.now()}];
  });

  card2.addEventListener('pointermove', e => {
    if(!armed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if(!active){
      // 10px のヒステリシス。縦が勝っていればスクロールに譲る
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if(Math.abs(dy) > Math.abs(dx)){ armed = false; return; }
      active = true;
      card2.setPointerCapture(e.pointerId);
      navSpring.stop();
    }

    history.push({x:e.clientX, t:performance.now()});
    if(history.length > 6) history.shift();

    let p = startNav - dx / W;          // 指に 1:1 で貼り付く
    if(p > 1){                          // 左方向には行き先がない → ラバーバンド
      p = 1 + rubberband(p - 1, 1);
    } else if(p < 0){
      p = rubberband(p, 1);
    }
    navSpring.setValue(p);
  });

  const release = e => {
    if(!armed) return;
    const wasActive = active;
    armed = false; active = false;
    if(!wasActive) return;
    try{ card2.releasePointerCapture(e.pointerId); }catch(_){}

    // 指の速度（px/s）→ 正規化速度（nav/s）
    const now = performance.now();
    const recent = history.filter(h => now - h.t < 90);
    let vx = 0;
    if(recent.length >= 2){
      const a = recent[0], b = recent[recent.length - 1];
      if(b.t > a.t) vx = (b.x - a.x) / ((b.t - a.t) / 1000);
    }
    const vNav = -vx / W;

    // 着地点を速度から予測してから，近い方のスナップ点を選ぶ
    const projected = navSpring.value + project(vNav);
    const target = projected < 0.5 ? 0 : 1;

    // 勢いのあるジェスチャなので少しだけバウンス。速度はそのまま引き継ぐ
    navSpring.to(target, {velocity: vNav, bounce:0.2, duration:0.35});
    if(target === 0){
      haptic(8);
      document.getElementById('resultBox').innerHTML = '';
    }
  };
  card2.addEventListener('pointerup', release);
  card2.addEventListener('pointercancel', release);
})();

/* ===========================================================
   入力 UI
   =========================================================== */
const state = {a:'', b:'', active:'a', optimal:null};

function buildPad(container, field){
  const keys = ['1','2','3','4','5','6','7','8','9','±','0','⌫'];
  container.innerHTML='';
  keys.forEach(k=>{
    const btn=document.createElement('button');
    btn.className='key';
    if(k==='⌫') btn.className+=' util';
    if(k==='±') btn.className+=' sign';
    btn.textContent=k;
    btn.addEventListener('click',()=>press(field,k));
    makePressable(btn, 0.94);
    container.appendChild(btn);
  });
}

function press(field,k){
  let v = state[field];
  if(k==='⌫'){
    if(v==='-'||v===''){ v=''; }
    else v = v.slice(0,-1);
  } else if(k==='±'){
    if(v.startsWith('-')) v=v.slice(1);
    else v='-'+v;
  } else { // digit
    if(v==='0') v='';        // leading zero replace
    if(v==='-0') v='-';
    v = v + k;
  }
  state[field]=v;
  render();
}

function fmtDisplay(v){
  if(v===''||v==='-'){
    return `<span class="ph">${v==='-'?'−':'0'}</span>`;
  }
  const n = parseInt(v,10);
  return `${n.toLocaleString('ja-JP')}<span class="unit">円</span>`;
}

function render(){
  document.getElementById('dispA').innerHTML = fmtDisplay(state.a);
  document.getElementById('dispB').innerHTML = fmtDisplay(state.b);
  // btnNext有効化
  const aValid = state.a!=='' && state.a!=='-';
  document.getElementById('btnNext').disabled = !aValid;
}

function parseVal(v){ return parseInt(v||'0',10); }

/* --- btnReset の出入り --- */
const resetSpring = new Spring(0, {bounce:0, duration:0.4, precision:0.002});
resetSpring.onUpdate(p=>{
  btnReset.style.opacity = String(clamp01(p));
  btnReset.style.transform = `translate3d(0,${(1-p)*10}px,0)`;
});
resetSpring.onRest = ()=>{ if(resetSpring.target === 0) btnReset.style.display = 'none'; };
function showReset(){ btnReset.style.display='block'; resetSpring.to(1); }
function hideReset(){ resetSpring.to(0); }

/* ---- STEP1 -> STEP2 ---- */
document.getElementById('btnNext').addEventListener('click',()=>{
  const a = parseVal(state.a);
  state.optimal = computeOptimal(a);
  const {optimalBMods, bestBagCombos} = state.optimal;

  // 条件表示
  let html = `<div class="label">戻す額の「下一桁」を次のいずれかに:</div>
    <div class="modlist">${optimalBMods.map(m=>`<span class="modchip">${m}</span>`).join('')}</div>
    <div class="label">【戻しの条件】</div>`;
  optimalBMods.forEach(bm=>{
    const [bValTarget] = bestBagCombos[bm];
    const items = returnBags[bValTarget].items;
    html += `<div class="cond">下一桁を <b>${bm}</b> にする場合：${bagStr(items)} が含まれる会計を探す（計 ${bValTarget} 円分）</div>`;
  });
  document.getElementById('condBox').innerHTML = html;
  document.getElementById('minB').textContent = (-a).toLocaleString('ja-JP');

  measure();
  navSpring.to(1, {bounce:0, duration:0.4});
  showReset();
  document.getElementById('msgB').innerHTML='';
  document.getElementById('resultBox').innerHTML='';

  // チップは順に実体化して，視線を次の操作へ導く
  document.querySelectorAll('#condBox .modchip').forEach((chip,i)=>{
    chip.style.opacity='0';
    setTimeout(()=>materialize(chip,{blur:4,lift:8,scaleFrom:0.8,bounce:0.25,duration:0.4}), 90 + i*45);
  });
});

/* ---- 戻る ---- */
document.getElementById('btnBack').addEventListener('click',()=>{
  navSpring.to(0, {bounce:0, duration:0.4});
  document.getElementById('resultBox').innerHTML='';
});

/* ---- 計算 ---- */
document.getElementById('btnCalc').addEventListener('click',()=>{
  const a = parseVal(state.a);
  const b = parseVal(state.b);
  const {optimalBMods, bestBagCombos} = state.optimal;
  const res = computePlan(a,b,optimalBMods,bestBagCombos);
  const msgBox = document.getElementById('msgB');
  const resultBox = document.getElementById('resultBox');
  resultBox.innerHTML='';

  if(!res.ok){
    msgBox.innerHTML = `<div class="msg ${res.type==='warn'?'warn':'err'}">${res.c!==undefined?`空打ち額 ${res.c.toLocaleString('ja-JP')} 円 ／ `:''}${res.msg}</div>`;
    measure();
    materialize(msgBox.firstElementChild,{blur:5,lift:8,scaleFrom:0.98,bounce:0,duration:0.34});
    haptic([10,60,10]);   // error：視覚と同じ瞬間に
    return;
  }
  msgBox.innerHTML='';
  measure();
  let rows = '';
  for(const name in res.combo){
    rows += `<div class="row"><span>${name}</span><span class="c">${res.combo[name]} 個</span></div>`;
  }
  resultBox.innerHTML = `
    <div class="result">
      <h2>構成が見つかりました</h2>
      <div class="row"><span>空打ち額</span><span class="big">${res.c.toLocaleString('ja-JP')} 円</span></div>
      <div class="label" style="margin:.875rem 0 .25rem;">【購入内訳】</div>
      ${rows}
      <div class="total">合計点数：${res.total} 点</div>
    </div>`;
  materialize(resultBox.firstElementChild,{blur:10,lift:14,scaleFrom:0.96,bounce:0,duration:0.45});
  haptic(12);             // commit
  resultBox.scrollIntoView({behavior: reduceMotion.matches ? 'auto' : 'smooth', block:'nearest'});
});

/* ---- リセット ---- */
btnReset.addEventListener('click',()=>{
  state.a=''; state.b=''; state.optimal=null;
  navSpring.to(0, {bounce:0, duration:0.4});
  hideReset();
  document.getElementById('resultBox').innerHTML='';
  document.getElementById('msgB').innerHTML='';
  document.getElementById('condBox').innerHTML='';
  render();
  measure();
});

/* ---- scroll edge effect：重なる瞬間だけ境界を出す ---- */
const navEdge = () => {
  const on = window.scrollY > 6;
  navEl.style.setProperty('--edge', on ? '1' : '0');
  const after = on ? 1 : 0;
  navEl.classList.toggle('scrolled', on);
};
const edgeStyle = document.createElement('style');
edgeStyle.textContent = '.nav.scrolled::after{opacity:1; transition:opacity .25s ease;} .nav::after{transition:opacity .25s ease;}';
document.head.appendChild(edgeStyle);
window.addEventListener('scroll', navEdge, {passive:true});

/* 初期化 */
[document.getElementById('btnNext'),
 document.getElementById('btnCalc'),
 document.getElementById('btnBack'),
 btnReset].forEach(b => makePressable(b, 0.982));

buildPad(document.getElementById('padA'),'a');
buildPad(document.getElementById('padB'),'b');
render();
measure();

if(window.ResizeObserver){
  const ro = new ResizeObserver(()=>measure());
  ro.observe(card1); ro.observe(card2); ro.observe(deck);
}
window.addEventListener('resize', measure);
window.addEventListener('load', measure);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
navEdge();
</script>
</body>
